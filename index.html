<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WhereiPark Landing Page Prototypes</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; font-family: "Inter", system-ui, sans-serif; color: #181d27; background: #f8f9fa; }
    main { max-width: 40rem; margin: 0 auto; padding: 4rem 1.5rem; }
    h1 { font-size: 1.75rem; font-weight: 600; margin: 0 0 0.5rem; }
    p { color: #535862; margin: 0 0 2rem; }
    a.card { display: block; padding: 1.25rem 1.5rem; background: #fff; border: 1px solid #e9eaeb; border-radius: 12px; text-decoration: none; color: inherit; }
    a.card:hover { border-color: #00a7ca; }
    a.card strong { display: block; font-weight: 600; }
    a.card span { color: #535862; font-size: 0.875rem; }

<body>
  <main>
    <h1>WhereiPark landing page prototypes</h1>
    <p>Review builds of the group parking segment pages. Not the live site.</p>
    <a class="card" href="car-rental/">
      <strong>Car Rental &amp; Fleets</strong>
      <span>/group-parking-segment/car-rental-agency</span>
    </a>
    <a class="card" href="spacer/" style="margin-top: 1rem;">
      <strong>Spacer US Host Pages</strong>
      <span>5 rent-my-* child pages on the rent-my-driveway template</span>
    </a>
